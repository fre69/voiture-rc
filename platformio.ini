; Robot Mecanum ESP32 — PlatformIO Configuration
;
; IMPORTANT : Bluepad32 remplace le core Arduino ESP32 standard.
; Le package framework ci-dessous pointe vers le core Bluepad32.
; Verifier la derniere version sur :
; https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases
;
; Alternative : utiliser Arduino IDE avec le Board Manager Bluepad32
; URL : https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
; Board : "Bluepad32 > ESP32 Dev Module"

[env:esp32-bluepad32]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.1/framework-arduinoespressif32-bluepad32-4.1.1.zip

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0

monitor_speed = 115200
upload_speed = 921600
