; Robot Mecanum ESP32 — PlatformIO Configuration
;
; Bluepad32 remplace le core Arduino ESP32 standard.
; Le framework ci-dessous est le core Arduino ESP32 avec Bluepad32 integre.
;
; Alternative : Arduino IDE avec le Board Manager Bluepad32
; URL : https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
; Board : "Bluepad32 > ESP32 Dev Module"

[env:esp32-bluepad32]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.0

monitor_speed = 115200
upload_speed = 921600
